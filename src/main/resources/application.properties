spring.application.name=trabalhojusto

# ---- Banco de dados (PostgreSQL via docker-compose) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trabalhojusto}
spring.datasource.username=${DB_USER:trabalhojusto}
spring.datasource.password=${DB_PASSWORD:trabalhojusto}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- RabbitMQ (requisito 5, opção A) ----
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}

# ---- Spring AI (OpenAI) ----
# Sem OPENAI_API_KEY a aplicação sobe normalmente: a análise usa um texto padrão e /ia/interpretar-relato responde 503.
spring.ai.openai.api-key=${OPENAI_API_KEY:sem-chave-configurada}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}

# ---- JWT ----
# Defina JWT_SECRET (mínimo 32 caracteres). Se vazio, uma chave aleatória é gerada a cada execução.
jwt.secret=${JWT_SECRET:}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# ---- Dados de teste (usuários e demonstração). Use SEED_ENABLED=false em produção. ----
app.seed.enabled=${SEED_ENABLED:true}

# ---- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
