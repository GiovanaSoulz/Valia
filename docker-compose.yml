# Sobe PostgreSQL e RabbitMQ para desenvolvimento:   docker compose up -d
# Sobe também a API em container:                    docker compose --profile app up -d --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: trabalhojusto
      POSTGRES_USER: trabalhojusto
      POSTGRES_PASSWORD: trabalhojusto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trabalhojusto -d trabalhojusto"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"   # painel: http://localhost:15672 (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/trabalhojusto
      DB_USER: trabalhojusto
      DB_PASSWORD: trabalhojusto
      RABBIT_HOST: rabbitmq
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sem-chave-configurada}
      JWT_SECRET: ${JWT_SECRET:-}

volumes:
  pgdata:
